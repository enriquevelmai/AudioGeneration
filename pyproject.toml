[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-tts"
version = "1.0.0"
description = "Turn Markdown scripts into multi-voice podcasts with local voice cloning (F5-TTS, XTTS v2) or commercial cloud TTS (ElevenLabs, Azure AI Speech, OpenAI)."
readme = "README.md"
authors = [{ name = "enriquevelmai" }]
# MIT covers the code only. The model weights have their own licenses
# (mostly NON-commercial): see MODELS_AND_LICENSES.md.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "tts", "text-to-speech", "podcast", "voice-cloning", "f5-tts", "xtts",
    "coqui", "elevenlabs", "azure-speech", "openai", "gradio", "markdown", "spanish",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11,<3.12"
# Core WITHOUT torch: parser, dummy engine, CLI, UI, model management and fast tests.
dependencies = [
    "numpy",
    "pydub",
    "gradio",
    "pyyaml",
    "scipy",
    "pyloudnorm",
    # `podcast-tts models`: downloads/updates the models (gradio already pulls it in; declared explicitly)
    "huggingface-hub",
]

[project.optional-dependencies]
# Local F5-TTS and XTTS v2 engines. Combine with `cuda` (NVIDIA GPU) or `cpu`:
#   uv sync --extra local --extra cuda      |      uv sync --extra local --extra cpu
local = [
    "f5-tts",
    "coqui-tts>=0.27,<0.28",
    # coqui-tts 0.27.x imports transformers.pytorch_utils.isin_mps_friendly, removed in transformers 5
    "transformers>=4.57,<5",
    # torch 2.8: last version whose torchaudio.load/save uses soundfile; from 2.9 on it requires torchcodec,
    # which on Windows needs the shared FFmpeg DLLs (the usual ffmpeg build is static).
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "soundfile",
]
# torch variant: mutually exclusive (see [tool.uv] conflicts and [tool.uv.sources]).
cuda = ["torch==2.8.*", "torchaudio==2.8.*"]
cpu = ["torch==2.8.*", "torchaudio==2.8.*"]
# Desktop app (`podcast-tts desktop`): native WebView2 window instead of the browser.
desktop = ["pywebview>=5"]
# MCP server (`podcast-tts mcp`): exposes the tool to AI assistants (Claude Desktop,
# Claude Code, Cursor, VS Code...) over stdio. See docs/MCP.md.
mcp = ["mcp>=1.12,<2"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/enriquevelmai/AudioGeneration"
Issues = "https://github.com/enriquevelmai/AudioGeneration/issues"
Releases = "https://github.com/enriquevelmai/AudioGeneration/releases"

[project.scripts]
podcast-tts = "podcast_tts.cli:main"
podcast-tts-mcp = "podcast_tts.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `pytest` excludes the slow tests (real models); `pytest -m slow` runs them.
addopts = "-m 'not slow'"
markers = [
    "slow: synthesizes with the real models (F5-TTS / XTTS v2); requires the local extra and downloaded models",
]

[tool.uv]
# Windows (real use) and Linux (CI with core + dev). Resolving only these platforms prevents the
# universal lockfile from picking old versions for platforms that are not used.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# Without this the lock resolver falls back to datasets 2.14 (2023), incompatible with modern fsspec.
constraint-dependencies = ["datasets>=4"]
# Official uv pattern for PyTorch: one variant or the other, never both.
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12.6 (sm_50-sm_90: GTX 900 to RTX 40). RTX 50 cards (Blackwell, sm_120) would need cu128.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
