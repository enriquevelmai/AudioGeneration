[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-tts"
version = "0.1.0"
description = "Turn Markdown scripts into multi-voice podcasts with local voice cloning (F5-TTS, XTTS v2) or commercial cloud TTS (ElevenLabs, Azure AI Speech, OpenAI)."
readme = "README.md"
authors = [{ name = "enriquevelmai" }]
# MIT cubre solo el código. Los pesos de los modelos tienen sus propias licencias
# (mayoritariamente NO comerciales): ver MODELS_AND_LICENSES.md.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "tts", "text-to-speech", "podcast", "voice-cloning", "f5-tts", "xtts",
    "coqui", "elevenlabs", "azure-speech", "openai", "gradio", "markdown", "spanish",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11,<3.12"
# Núcleo SIN torch: parser, motor dummy, CLI, UI, gestión de modelos y tests rápidos.
dependencies = [
    "numpy",
    "pydub",
    "gradio",
    "pyyaml",
    "scipy",
    "pyloudnorm",
    # `podcast-tts models`: descarga/actualiza los modelos (ya lo trae gradio; se declara explícito)
    "huggingface-hub",
]

[project.optional-dependencies]
# Motores locales F5-TTS y XTTS v2. Combinar con `cuda` (GPU NVIDIA) o `cpu`:
#   uv sync --extra local --extra cuda      |      uv sync --extra local --extra cpu
local = [
    "f5-tts",
    "coqui-tts>=0.27,<0.28",
    # coqui-tts 0.27.x importa transformers.pytorch_utils.isin_mps_friendly, eliminado en transformers 5
    "transformers>=4.57,<5",
    # torch 2.8: última versión cuyo torchaudio.load/save usa soundfile; desde 2.9 exige torchcodec,
    # que en Windows necesita las DLL compartidas de FFmpeg (el ffmpeg habitual es estático).
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "soundfile",
]
# Variante de torch: mutuamente excluyentes (ver [tool.uv] conflicts y [tool.uv.sources]).
cuda = ["torch==2.8.*", "torchaudio==2.8.*"]
cpu = ["torch==2.8.*", "torchaudio==2.8.*"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/enriquevelmai/AudioGeneration"
Issues = "https://github.com/enriquevelmai/AudioGeneration/issues"
Releases = "https://github.com/enriquevelmai/AudioGeneration/releases"

[project.scripts]
podcast-tts = "podcast_tts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `pytest` excluye los tests lentos (modelos reales); `pytest -m slow` los ejecuta.
addopts = "-m 'not slow'"
markers = [
    "slow: sintetiza con los modelos reales (F5-TTS / XTTS v2); requiere el extra local y modelos descargados",
]

[tool.uv]
# Windows (uso real) y Linux (CI con núcleo + dev). Resolver solo estas plataformas evita que el
# lockfile universal elija versiones antiguas para plataformas que no se usan.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# Sin esto el resolvedor del lock retrocede a datasets 2.14 (2023), incompatible con fsspec moderno.
constraint-dependencies = ["datasets>=4"]
# Patrón oficial de uv para PyTorch: una variante u otra, nunca las dos.
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12.6 (sm_50-sm_90: GTX 900 a RTX 40). Las RTX 50 (Blackwell, sm_120) necesitarían cu128.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
